name: CI

# Corpus-free by design: every fixture in pkg/holocropper is synthesized with
# ffmpeg's lavfi sources (buildFixture), and framing parity is held by the
# golden CSVs in pkg/holocropper/testdata, one per ffmpeg MAJOR version
# (the decision stream follows the encode/decode + scaler artifacts of the
# ffmpeg build, which drift by a pixel between majors). No asset video is
# needed or read. HOLOCROPPER_REQUIRE_FFMPEG makes a missing ffmpeg a FAILURE
# rather than a silent skip of the fixture tests.
#
# The holocropper job pins ubuntu-24.04 so its apt ffmpeg stays the version
# the ffmpeg6 golden was recorded on. If GitHub ever changes this image's
# ffmpeg major, the parity test fails with the exact regeneration command
# (HOLOCROPPER_REGENERATE_GOLDEN=1) - commit the new golden it names.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      regenerate_golden:
        description: >-
          Record the parity goldens with this runner's ffmpeg build and upload
          them as an artifact - download, review the diff, commit. Use when
          the pinned image's ffmpeg no longer reproduces a committed golden
          (the decision stream follows the build's encode/decode behavior).
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holocropper:
    name: holocropper (-race, golden parity, CLI smoke)
    # Pinned: the ffmpeg6 golden was recorded against this image's ffmpeg.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pkg/holocropper
    env:
      HOLOCROPPER_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/holocropper/go.mod
          cache-dependency-path: pkg/holocropper/go.sum

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/holocropper" ./cmd/holocropper

      - name: Test
        run: go test -count=1 -race -timeout 600s ./...
        env:
          HOLOCROPPER_REGENERATE_GOLDEN: ${{ inputs.regenerate_golden && '1' || '' }}

      - name: Upload regenerated goldens
        if: inputs.regenerate_golden
        uses: actions/upload-artifact@v4
        with:
          name: parity-goldens
          path: pkg/holocropper/testdata/*.csv

      # Backwards-compatibility smoke: legacy flags in, legacy file name out.
      # Also proves the second render of an unchanged input hits the analysis
      # cache and still writes the same legacy-named file.
      - name: CLI renders the fixture with legacy naming
        run: |
          set -euo pipefail
          rm -rf /tmp/ci-cli && mkdir -p /tmp/ci-cli/in /tmp/ci-cli/out /tmp/ci-cli/tmp
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=black:s=960x540:d=4:r=24" \
            -f lavfi -i "color=c=white:s=120x60:d=4:r=24" \
            -f lavfi -i "sine=frequency=440:duration=4" \
            -filter_complex "[0:v][1:v]overlay=x='60+90*t':y=240,format=yuv420p[v]" \
            -map "[v]" -map "2:a" -c:v libx264 -preset ultrafast -c:a aac -shortest \
            /tmp/ci-cli/in/dance.mp4
          "$RUNNER_TEMP/holocropper" -i /tmp/ci-cli/in -o /tmp/ci-cli/out \
            -temp-dir /tmp/ci-cli/tmp -w 240 -h 240 -fps 20
          test -f /tmp/ci-cli/out/dance.mp4 || { echo "legacy output name dance.mp4 missing"; exit 1; }
          test "$(ls /tmp/ci-cli/out | wc -l)" -eq 1 || { echo "unexpected extra outputs"; ls -l /tmp/ci-cli/out; exit 1; }
          ffprobe -hide_banner -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 /tmp/ci-cli/out/dance.mp4 | grep -qx 240,240
          # re-render at another target: same legacy name, still one file
          "$RUNNER_TEMP/holocropper" -i /tmp/ci-cli/in -o /tmp/ci-cli/out \
            -temp-dir /tmp/ci-cli/tmp -w 420 -h 240 -fps 20
          test "$(ls /tmp/ci-cli/out | wc -l)" -eq 1 || { echo "re-render clobbered the naming"; ls -l /tmp/ci-cli/out; exit 1; }
          ffprobe -hide_banner -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 /tmp/ci-cli/out/dance.mp4 | grep -qx 420,240

      - name: CLI fit mode (-fit) renders the fixture on bars
        run: |
          set -euo pipefail
          # Fit mode (§6.10): whole frame scaled to fit, black bars, no crop.
          # The analysis cache from the previous step is reused (same input).
          "$RUNNER_TEMP/holocropper" -i /tmp/ci-cli/in -o /tmp/ci-cli/out \
            -temp-dir /tmp/ci-cli/tmp -w 240 -h 240 -fps 20 -fit
          test -f /tmp/ci-cli/out/dance.mp4 || { echo "fit render lost the legacy name"; exit 1; }
          ffprobe -hide_banner -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 /tmp/ci-cli/out/dance.mp4 | grep -qx 240,240
          # Fit auto-orient is pure geometry: a portrait fit request on a 16:9
          # clip must flip to the least-bars orientation (420x240).
          "$RUNNER_TEMP/holocropper" -i /tmp/ci-cli/in -o /tmp/ci-cli/out \
            -temp-dir /tmp/ci-cli/tmp -w 240 -h 420 -fps 20 -fit -auto-orient 2>&1 | tee fit-orient.log
          grep -q "FLIPPING to 420x240" fit-orient.log
          ffprobe -hide_banner -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0 /tmp/ci-cli/out/dance.mp4 | grep -qx 420,240

      # MikV output smoke (§6.11): -mikv writes the firmware container.
      # Header layout checked raw: bytes 7-8 LE audio sample rate, byte 13
      # video encoding, byte 14 audio encoding, byte 15 reserved zero.
      - name: CLI mikv output (-mikv) writes legacy-encoding containers
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/holocropper" -i /tmp/ci-cli/in -o /tmp/ci-cli/out \
            -temp-dir /tmp/ci-cli/tmp -w 120 -h 120 -fps 20 -mikv
          mikv=/tmp/ci-cli/out/dance-120x120.mikv
          test -f "$mikv" || { echo "mikv output missing"; exit 1; }
          od -An -c -N4 "$mikv" | grep -q "M   i   k   V"
          # offsets 9-10: 16000 Hz default; byte 13/14/15: encodings 0/0
          # (DEFLATE RGB565 + raw PCM) with reserved zero
          od -An -tu1 -j9 -N2 "$mikv" | grep -Eq "128[[:space:]]+62"
          od -An -tu1 -j13 -N3 "$mikv" | grep -Eq "^ +0[[:space:]]+0[[:space:]]+0$"

      # The firmware MJPEG+Opus pairing: 24 fps + 48 kHz, 40 ms Opus packets.
      - name: CLI mikv MJPEG+Opus pairing (-mikv -mikv-jpeg -mikv-opus)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/holocropper" -i /tmp/ci-cli/in -o /tmp/ci-cli/out \
            -temp-dir /tmp/ci-cli/tmp -w 100 -h 100 -fps 24 -mikv -mikv-jpeg -mikv-opus -opus-bitrate 32
          mikv=/tmp/ci-cli/out/dance-100x100.mikv
          test -f "$mikv" || { echo "mikv opus pairing output missing"; exit 1; }
          # offsets 9-10: 48000 Hz; byte 13/14/15: encodings 1/1 (JPEG +
          # OGG-Opus) with reserved zero
          od -An -tu1 -j9 -N2 "$mikv" | grep -Eq "128[[:space:]]+187"
          od -An -tu1 -j13 -N3 "$mikv" | grep -Eq "^ +1[[:space:]]+1[[:space:]]+0$"
          # Every JPEG frame payload is stored raw, so the container carries
          # at least one FFD8 SOI per frame (4 s x 24 fps = 96 frames), and
          # the audio chunks are pages of one Ogg stream.
          soi_count=$(od -An -tx1 "$mikv" | tr -d ' \n' | grep -o 'ffd8' | wc -l)
          [ "$soi_count" -ge 96 ] || { echo "only $soi_count JPEG SOI markers, want >= 96"; exit 1; }
          ogg_pages=$(od -An -c "$mikv" | tr -d ' \n' | grep -o 'OggS' | wc -l)
          [ "$ogg_pages" -ge 3 ] || { echo "only $ogg_pages Ogg pages in the audio track"; exit 1; }

  rest-of-repo:
    name: server + mikv (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            pkg/mikvformat/go.sum
            pkg/mikvserver/go.sum

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Build and vet the main module
        run: go build ./... && go vet ./...

      - name: Build, vet and test pkg/mikvformat
        working-directory: pkg/mikvformat
        env:
          HOLOCROPPER_REQUIRE_FFMPEG: "1"
        run: |
          go build ./... && go vet ./...
          go test -count=1 -timeout 300s ./...

      - name: Build and vet pkg/mikvserver
        working-directory: pkg/mikvserver
        run: go build ./... && go vet ./...
